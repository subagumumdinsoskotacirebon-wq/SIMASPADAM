<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sapras Rescue</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f3f5f9; --card:#fff; --ink:#1b2333; --mute:#5b6577; --line:#dde2ec;
  --brand:#c62828; --brand2:#ef6c00; --blue:#1d5fd1;
  --good:#17714a; --goodbg:#e2f5ea; --warn:#8a5a00; --warnbg:#fff1cc; --bad:#b3261e; --badbg:#fde3e0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:18px 16px}
header h1{margin:0;font-size:24px}
header p{margin:2px 0 0;font-size:14px;opacity:.92}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px 50px}
.hd{max-width:1100px;margin:0 auto}

/* menu */
.menu{position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 0 10px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.menu button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 6px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.25}
.menu button .ic{font-size:24px}
.menu button.on{border-color:var(--brand);background:var(--brand);color:#fff}
@media(max-width:700px){.menu{grid-template-columns:repeat(2,1fr)}}

.view{display:none}.view.on{display:block}
h2{font-size:20px;margin:6px 0 12px}
h3{font-size:17px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.mute{color:var(--mute);font-size:14px}
.grid{display:grid;gap:12px}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}

/* status */
.banner{border-radius:14px;padding:16px 18px;font-size:18px;font-weight:700;margin-bottom:14px;display:flex;gap:12px;align-items:center}
.banner small{display:block;font-weight:500;font-size:14px;margin-top:2px}
.banner .big{font-size:34px}
.banner.good{background:var(--goodbg);color:var(--good)}
.banner.warn{background:var(--warnbg);color:var(--warn)}
.banner.bad{background:var(--badbg);color:var(--bad)}
.banner.none{background:#e9edf5;color:var(--mute)}
.tile{text-align:center}
.tile .n{font-size:40px;font-weight:800;line-height:1.1}
.tile .t{font-size:14px;color:var(--mute)}
.badge{display:inline-block;border-radius:99px;padding:3px 12px;font-weight:800;font-size:13px;letter-spacing:.3px}
.badge.good{background:var(--goodbg);color:var(--good)}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.bad{background:var(--badbg);color:var(--bad)}
.badge.none{background:#e9edf5;color:var(--mute)}
.c-good{color:var(--good)}.c-warn{color:var(--warn)}.c-bad{color:var(--bad)}

.todo{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.todo li{border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.todo li.bad{background:var(--badbg)}.todo li.warn{background:var(--warnbg)}
.todo b{display:block}
.ucard .nm{font-weight:800;font-size:18px;margin-bottom:6px}
.bar{height:12px;background:#e6eaf2;border-radius:9px;overflow:hidden;margin:2px 0 8px}
.bar i{display:block;height:100%;border-radius:9px}
.bar i.good{background:#2aa56b}.bar i.warn{background:#e8a317}.bar i.bad{background:#d9432f}.bar i.none{background:#c5ccd9}
.lbl{display:flex;justify-content:space-between;font-size:14px}

/* tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:2px solid var(--line);background:#fff;border-radius:99px;padding:8px 18px;font:inherit;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}

/* table */
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:15px;background:#fff}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#eef1f7;font-size:13px;position:sticky;top:0}
td.cell,th.c{text-align:center}
td.cell{font-weight:700}
td.cell.good{background:var(--goodbg);color:var(--good)}
td.cell.warn{background:var(--warnbg);color:var(--warn)}
td.cell.bad{background:var(--badbg);color:var(--bad)}
td.cell.none{color:var(--mute)}
tr.grp td{background:#f6f8fc;font-weight:800;font-size:13px;color:var(--mute)}
td.wrapc{white-space:normal;min-width:180px}
.legend{font-size:14px;margin:0 0 10px;color:var(--mute)}

/* rescue cards */
.rc .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rc .em{font-size:30px}
.rc .nm{font-weight:800;font-size:18px;flex:1}
.rc dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px}
.rc dt{color:var(--mute)}.rc dd{margin:0;font-weight:700}
.rc.bad{border:2px solid #e9a19a}.rc.warn{border:2px solid #efd085}

/* form */
label{display:block;font-weight:700;margin-bottom:4px;font-size:15px}
input,select{width:100%;border:2px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--blue)}
fieldset{border:2px solid var(--line);border-radius:12px;margin:0 0 14px;padding:12px 14px 14px}
legend{font-weight:800;font-size:17px;padding:0 6px}
.fr{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.btn{border:0;border-radius:12px;padding:14px 22px;font:inherit;font-weight:800;font-size:17px;cursor:pointer;color:#fff;background:var(--good)}
.btn:disabled{opacity:.55;cursor:wait}
.msg{display:none;border-radius:10px;padding:12px 14px;margin-top:12px;font-weight:700}
.msg.err{display:block;background:var(--badbg);color:var(--bad)}
.msg.ok{display:block;background:var(--goodbg);color:var(--good)}

/* download */
.dl{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.dl button{flex:1;min-width:130px;border:0;border-radius:12px;padding:14px 10px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;color:#fff}
.dl .w{background:#2b579a}.dl .x{background:#217346}.dl .p{background:#c62828}
.dl button:disabled{opacity:.55;cursor:wait}

.notice{border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:15px}
.notice.demo{background:var(--warnbg);color:var(--warn)}
.notice.err{background:var(--badbg);color:var(--bad)}
.empty{text-align:center;color:var(--mute);padding:26px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1b2333;color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;display:none;z-index:50;max-width:90%}
#loader{position:fixed;inset:0;background:rgba(243,245,249,.9);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--mute);z-index:40}
#loader.off{display:none}
footer{text-align:center;color:var(--mute);font-size:13px;margin-top:20px}
</style>
</head>
<body>
<div id="loader">Memuat data…</div>
<header><div class="hd"><h1>🔥 Sapras Rescue</h1><p>Pemantauan kondisi unit dan peralatan rescue</p></div></header>
<div class="wrap">
  <nav class="menu" id="menu">
    <button data-m="dash" class="on"><span class="ic">📊</span>Dashboard</button>
    <button data-m="unit"><span class="ic">🚒</span>Kondisi Unit</button>
    <button data-m="rescue"><span class="ic">🧰</span>Kondisi Peralatan Rescue</button>
    <button data-m="dl"><span class="ic">⬇️</span>Download Laporan</button>
  </nav>
  <div id="notice"></div>
  <section class="view on" id="v-dash"></section>
  <section class="view" id="v-unit"></section>
  <section class="view" id="v-rescue"></section>
  <section class="view" id="v-dl"></section>
  <footer id="foot"></footer>
</div>
<div id="toast"></div>

<script>
/* ============ PENGATURAN ============ */
var CFG = { FUEL_WARN:50, FUEL_CRIT:30, REFRESH_MS:120000 };
var PILIHAN_FISIK = ['Baik','Rusak Ringan','Rusak Berat'];
var PILIHAN_FUNGSI = ['Berfungsi','Tidak Berfungsi'];

var UNIT_ITEMS = [
  {k:'BBM_UNIT',l:'BBM Unit',t:'pct',g:'Bahan bakar dan oli',crit:true},
  {k:'BBM_PORTABLE',l:'BBM Portable',t:'pct',g:'Bahan bakar dan oli'},
  {k:'OLI_HISAP',l:'Oli Hisap',t:'pct',g:'Bahan bakar dan oli'},
  {k:'MESIN_PORTABLE',l:'Mesin Portable',t:'onoff',g:'Mesin dan lampu',crit:true},
  {k:'LAMPU_SIRINE',l:'Lampu Sirine',t:'onoff',g:'Mesin dan lampu',crit:true},
  {k:'LAMPU_DEPAN',l:'Lampu Depan',t:'onoff',g:'Mesin dan lampu'},
  {k:'LAMPU_REM',l:'Lampu Rem',t:'onoff',g:'Mesin dan lampu'},
  {k:'LAMPU_SEN',l:'Lampu Sen',t:'onoff',g:'Mesin dan lampu'},
  {k:'LAMPU_ROTARI',l:'Lampu Rotari',t:'onoff',g:'Mesin dan lampu'},
  {k:'AIR_RADIATOR',l:'Air Radiator',t:'cukup',g:'Cairan',crit:true},
  {k:'OLI_MESIN',l:'Oli Mesin',t:'cukup',g:'Cairan',crit:true}
];
var PERL_ITEMS = [
  {k:'SELANG_2_SETENGAH',l:'Selang 2½'},{k:'SELANG_1_SETENGAH',l:'Selang 1½'},
  {k:'NOZZLE_2_SETENGAH_GUN',l:'Nozzle 2½ Gun'},{k:'NOZZLE_1_SETENGAH_GUN',l:'Nozzle 1½ Gun'},
  {k:'NOZZLE_2_SETENGAH_CONVENTIONAL',l:'Nozzle 2½ Conventional'},{k:'NOZZLE_1_SETENGAH_CONVENTIONAL',l:'Nozzle 1½ Conventional'},
  {k:'CONNECTION_Y',l:'Connection Y'},{k:'CONNECTION_3',l:'Connection 3'}
];
var RESCUE_ITEMS = [
  {l:'Floating Pump',e:'💧'},{l:'Rebar Cutter',e:'✂️'},{l:'Cutter',e:'🔧'},{l:'Hydraulic Spreader',e:'🗜️'}
];
var DEFAULT_UNITS = [
  {kode:'UNIT_04',nama:'UNIT 04'},{kode:'UNIT_07',nama:'UNIT 07'},{kode:'UNIT_08',nama:'UNIT 08'},
  {kode:'UNIT_09',nama:'UNIT 09'},{kode:'UNIT_BANTUAN_PROV',nama:'UNIT BANTUAN PROV.'}
];
var LBL  = {good:'BAIK',warn:'PERLU DICEK',bad:'BERMASALAH',none:'BELUM ADA DATA'};
var ULBL = {good:'SIAP',warn:'PERLU DICEK',bad:'BERMASALAH',none:'BELUM ADA DATA'};
var SYM  = {good:'✔',warn:'⚠',bad:'✖',none:'–'};

var S = { raw:null, D:null, demo:false, menu:'dash', tu:'kini', tr:'kini', dirty:false, saving:false, busy:false };
var $ = function(id){ return document.getElementById(id); };

/* ============ ALAT BANTU ============ */
var MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function fmtD(iso){ if(!iso) return '-'; var p=String(iso).split('-'); return (+p[2])+' '+MON[+p[1]-1]+' '+p[0]; }
function toISODate(v){
  if(!v) return ''; var s=String(v).trim(), m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[1]+'-'+m[2]+'-'+m[3];
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
  if(m) return m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);
  return '';
}
function toNum(v){ if(v===''||v==null) return null; var n=Number(String(v).replace(',','.')); return isNaN(n)?null:n; }
function toast(t){ var el=$('toast'); el.textContent=t; el.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(function(){el.style.display='none';},3000); }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }

/* ============ PENILAIAN KONDISI UNIT ============ */
function pctVal(v){
  if(v===''||v==null) return null;
  var s=String(v).trim(), has=s.indexOf('%')>-1, n=parseFloat(s.replace('%','').replace(',','.'));
  if(isNaN(n)) return null;
  if(!has && n<=1) n=n*100;
  return Math.max(0,Math.min(100,n));
}
function scoreItem(d,raw){
  if(raw===''||raw==null) return null;
  if(d.t==='pct'){ var p=pctVal(raw); return p==null?null:p/100; }
  var s=String(raw).trim().toUpperCase();
  if(d.t==='onoff') return s==='ON'?1:s==='OFF'?0:null;
  if(d.t==='cukup') return s==='CUKUP'?1:s==='KURANG'?0:null;
  return null;
}
function levelOf(d,sc){
  if(sc==null) return null;
  if(d.t==='pct'){ var p=sc*100; return p>=CFG.FUEL_WARN?'good':p>=CFG.FUEL_CRIT?'warn':'bad'; }
  return sc>=1?'good':'bad';
}
function plainVal(d,raw){
  if(raw===''||raw==null) return '-';
  if(d.t==='pct'){ var p=pctVal(raw); return p==null?String(raw):Math.round(p)+'%'; }
  return String(raw).toUpperCase();
}
function unitSnap(r,u){
  var items=UNIT_ITEMS.map(function(d){ var raw=r[u.kode+'__'+d.k], sc=scoreItem(d,raw); return {k:d.k,l:d.l,t:d.t,g:d.g,crit:d.crit,raw:raw,score:sc,level:levelOf(d,sc)}; });
  var def=items.filter(function(i){return i.score!=null;});
  var issues=items.filter(function(i){return i.level==='bad'||i.level==='warn';});
  var crit=items.some(function(i){return i.level==='bad'&&i.crit;});
  var level=!def.length?'none':crit?'bad':issues.length?'warn':'good';
  return {code:u.kode,name:u.nama,items:items,n:def.length,issues:issues.length,level:level,
          ket:String(r[u.kode+'__KETERANGAN']||'').trim(),m:r._m};
}
function perlSnap(r,u){
  var items=PERL_ITEMS.map(function(d){ return {k:d.k,l:d.l,n:toNum(r[u.kode+'__'+d.k])}; });
  var got=items.filter(function(i){return i.n!=null;});
  return {items:items,n:got.length,total:got.length?got.reduce(function(a,i){return a+i.n;},0):null,
          ket:String(r[u.kode+'__KETERANGAN']||'').trim(),m:r._m};
}
function latestPer(rows,units,fn){
  var out={};
  units.forEach(function(u){
    for(var i=rows.length-1;i>=0;i--){ var s=fn(rows[i],u); if(s.n>0){ out[u.kode]=s; break; } }
  });
  return out;
}

/* ============ PENILAIAN PERALATAN RESCUE ============ */
function clsText(v){
  var s=String(v==null?'':v).trim().toLowerCase();
  if(!s||s==='-') return '';
  if(/ringan|sebagian/.test(s)) return 'warn';
  if(/rusak|tidak|mati|patah|bocor|hilang|berat|habis/.test(s)) return 'bad';
  if(/baik|berfungsi|normal|\bok\b|layak|bagus/.test(s)) return 'good';
  return 'neu';
}
function rStatus(it){
  if(it.jumlah==null && !it.fisik && !it.fungsi) return 'none';
  if(it.jumlah===0) return 'bad';
  var a=clsText(it.fisik), b=clsText(it.fungsi);
  if(a==='bad'||b==='bad') return 'bad';
  if(a==='warn'||b==='warn') return 'warn';
  if(a==='good'||b==='good') return 'good';
  return 'none';
}
function rNote(it){
  if(it.jumlah===0) return 'tidak tersedia (jumlah 0)';
  var out=[];
  if(clsText(it.fungsi)==='bad') out.push('fungsi: '+it.fungsi);
  if(clsText(it.fisik)==='bad'||clsText(it.fisik)==='warn') out.push('fisik: '+it.fisik);
  if(clsText(it.fungsi)==='warn') out.push('fungsi: '+it.fungsi);
  return out.join(', ');
}

/* ============ SIAPKAN DATA ============ */
function prepare(raw){
  var un=raw.unit||{units:[],unit:[],perl:[]};
  var P={updated:raw.updated||'',errors:raw.errors||[],units:un.units||[],U:un.unit||[],P:un.perl||[],R:[]};
  [P.U,P.P].forEach(function(arr){
    arr.forEach(function(r){
      var w=String(r.WAKTU_INPUT==null?'':r.WAKTU_INPUT), tgl=toISODate(r.TANGGAL_PEMERIKSAAN)||toISODate(w);
      r._m={tgl:tgl,key:(tgl||'0000-00-00')+'|'+w,pel:String(r.PELETON==null?'':r.PELETON),regu:String(r.REGU==null?'':r.REGU),nama:String(r.NAMA_PETUGAS||'')};
    });
    arr.sort(function(a,b){ return a._m.key<b._m.key?-1:a._m.key>b._m.key?1:0; });
  });
  if(!P.units.length){
    var set={},list=[],heads=Object.keys(P.U[0]||{}).concat(Object.keys(P.P[0]||{}));
    heads.forEach(function(h){ var m=h.match(/^(UNIT_[A-Z0-9_]+?)__/); if(m&&!set[m[1]]){ set[m[1]]=1; list.push({kode:m[1],nama:m[1].replace(/_/g,' ')}); } });
    P.units=list.length?list:DEFAULT_UNITS;
  }
  P.R=(raw.rescue||[]).map(function(r){
    return {row:r.row,peleton:r.peleton,regu:r.regu,tgl:toISODate(r.tgl),
      items:RESCUE_ITEMS.map(function(d,i){ var it=r.items[i]||{};
        return {l:d.l,e:d.e,jumlah:toNum(it.jumlah),fisik:String(it.fisik==null?'':it.fisik).trim(),fungsi:String(it.fungsi==null?'':it.fungsi).trim(),ket:String(it.ket==null?'':it.ket).trim()}; })};
  });
  return P;
}
function analyze(P){
  var D=P;
  D.lu=latestPer(P.U,P.units,unitSnap);
  D.lp=latestPer(P.P,P.units,perlSnap);
  D.lr=P.R.length?P.R[P.R.length-1]:null;
  D.alerts=[];
  P.units.forEach(function(u){
    var s=D.lu[u.kode]; if(!s) return;
    s.items.forEach(function(it){
      if(it.level!=='bad'&&it.level!=='warn') return;
      var msg=it.t==='pct'?it.l+' tinggal '+Math.round(pctVal(it.raw))+'%':it.t==='onoff'?it.l+' mati (OFF)':it.l+' kurang';
      D.alerts.push({sev:(it.level==='bad'&&it.crit)?'bad':'warn',who:u.nama,msg:msg});
    });
  });
  D.rescueOk=0; D.rescueTot=0;
  if(D.lr) D.lr.items.forEach(function(it){
    var st=rStatus(it); if(st==='none') return;
    D.rescueTot++;
    if(st==='good') D.rescueOk++;
    else D.alerts.push({sev:st==='bad'?'bad':'warn',who:it.l+' (Peralatan Rescue)',msg:rNote(it)||'perlu dicek'});
  });
  D.alerts.sort(function(a,b){ return (a.sev==='bad'?0:1)-(b.sev==='bad'?0:1); });
  D.unitReady=0; D.unitTot=0;
  P.units.forEach(function(u){ var s=D.lu[u.kode]; if(s){ D.unitTot++; if(s.level==='good') D.unitReady++; } });
  return D;
}

/* ============ TAMPILAN: DASHBOARD ============ */
function cellHtml(level,text){ return '<td class="cell '+level+'">'+SYM[level]+' '+esc(text)+'</td>'; }
function badge(level,labels){ return '<span class="badge '+level+'">'+SYM[level]+' '+(labels||LBL)[level]+'</span>'; }
function lastInfo(D){
  var all=[];
  D.U.forEach(function(r){ all.push(r._m); });
  var m=all.length?all[all.length-1]:null;
  return m;
}
function renderDash(D){
  var hasData=D.U.length||D.R.length;
  var bad=D.alerts.filter(function(a){return a.sev==='bad';}).length;
  var lvl=!hasData?'none':bad?'bad':D.alerts.length?'warn':'good';
  var head={
    none:['ℹ️','Belum ada data','Data akan muncul setelah pemeriksaan pertama diisi.'],
    good:['✅','Semua sapras dalam kondisi baik','Tidak ada yang perlu ditindaklanjuti.'],
    warn:['⚠️',D.alerts.length+' hal perlu dicek','Lihat daftar di bawah.'],
    bad:['🚨',D.alerts.length+' hal perlu ditindaklanjuti ('+bad+' penting)','Segera periksa yang berwarna merah.']
  }[lvl];
  var m=lastInfo(D);
  var info=[]; if(m) info.push('Pemeriksaan unit terakhir: '+fmtD(m.tgl)+(m.nama?' oleh '+esc(m.nama):''));
  if(D.lr&&D.lr.tgl) info.push('Peralatan rescue terakhir diisi: '+fmtD(D.lr.tgl));
  var html='<div class="banner '+lvl+'"><span class="big">'+head[0]+'</span><div>'+head[1]+'<small>'+head[2]+(info.length?' &nbsp;·&nbsp; '+info.join(' · '):'')+'</small></div></div>';

  html+='<div class="grid g3" style="margin-bottom:14px">'+

function submitRescue(){
  if(S.saving) return;
  var v=function(id){ return $(id).value; };
  var p={peleton:v('fPel'),regu:v('fRegu'),items:[]};
  if(!p.peleton) return showMsg('Pilih Peleton dulu.');
  if(!p.regu) return showMsg('Pilih Regu dulu.');
  for(var i=0;i<RESCUE_ITEMS.length;i++){
    var j=v('j'+i), n=RESCUE_ITEMS[i].l;

      if(!v('u'+i)) return showMsg('Pilih kondisi fungsi '+n+'.');
    }
    p.items.push({jumlah:j,fisik:v('f'+i),fungsi:v('u'+i),ket:v('k'+i)});
  }
  if(typeof google==='undefined'||!google.script||!google.script.run) return showMsg('Mode contoh: belum terhubung ke Google Sheet, data tidak bisa disimpan.');

    S.saving=false; S.dirty=false; S.tr='kini'; S.demo=false; toast('✔ Data berhasil disimpan'); load(false);
  }).withFailureHandler(function(e){

    showMsg('Gagal menyimpan: '+(e&&e.message?e.message:e));
  }).saveRescue(p);
}

  });
  [2,1,0].forEach(function(b,bi){
    var items=RESCUE_ITEMS.map(function(d,i){ return {jumlah:2,fisik:'Baik',fungsi:'Berfungsi',ket:''}; });
    if(b===0){ items[1].fungsi='Tidak Berfungsi'; items[1].ket='Mata pisau tumpul'; items[3].fisik='Rusak Ringan'; }
    R.push({row:4+bi,peleton:bi+1,regu:bi+2,tgl:iso(b),items:items});
  });
  return {updated:'(data contoh)',errors:[],unit:{units:units,unit:U,perl:P},rescue:R};
}

/* ============ RENDER UTAMA ============ */
function render(){
  S.D=analyze(prepare(S.raw));
  renderDash(S.D); renderUnit(S.D); renderRescue(S.D); renderDl(S.D);
  var n=$('notice'), h='';
  if(S.demo) h+='<div class="notice demo">🧪 <b>Ini DATA CONTOH.</b> Data asli akan tampil otomatis setelah ada isian di Google Sheet.</div>';
  (S.D.errors||[]).forEach(function(e){ h+='<div class="notice err">❌ '+esc(e)+' Pastikan akun yang menjalankan aplikasi punya akses ke spreadsheet.</div>'; });
  n.innerHTML=h;
  $('foot').textContent='Diperbarui: '+(S.D.updated||'-');
}
function load(silent){
  if(S.busy) return; S.busy=true;
  if(!silent) $('loader').classList.remove('off');
  var done=function(raw,demo){
    S.busy=false;
    if(silent && S.dirty){ return; }       // jangan menimpa formulir yang sedang diisi
    S.raw=raw; S.demo=demo; render(); $('loader').classList.add('off');
  };
  if(typeof google==='undefined'||!google.script||!google.script.run){ done(makeDemo(),true); return; }
  google.script.run.withSuccessHandler(function(d){
    var empty=!((d.unit&&(d.unit.unit.length||d.unit.perl.length))||(d.rescue&&d.rescue.length));
    if(empty&&!d.errors.length) done(makeDemo(),true); else done(d,false);
  }).withFailureHandler(function(e){
    S.busy=false; $('loader').classList.add('off');
    $('notice').innerHTML='<div class="notice err">❌ Gagal memuat data: '+esc(e&&e.message?e.message:e)+'</div>';
  }).getData();
}

/* ============ KLIK ============ */
document.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('button'):null; if(!t) return;
  if(t.dataset.m){
    S.menu=t.dataset.m;
    Array.prototype.forEach.call(document.querySelectorAll('#menu button'),function(b){ b.classList.toggle('on',b===t); });
    Array.prototype.forEach.call(document.querySelectorAll('.view'),function(v){ v.classList.toggle('on',v.id==='v-'+S.menu); });
    window.scrollTo(0,0);
  } else if(t.dataset.tu){ S.tu=t.dataset.tu; renderUnit(S.D); }
  else if(t.dataset.tr){ S.tr=t.dataset.tr; S.dirty=false; renderRescue(S.D); }
  else if(t.id==='bSave'){ submitRescue(); }
  else if(t.dataset.f){ makeFile(t.dataset.r,t.dataset.f,t); }
});
document.addEventListener('input',function(e){ if(e.target.closest&&e.target.closest('#v-rescue')) S.dirty=true; });
setInterval(function(){ if(!S.demo) load(true); },CFG.REFRESH_MS);
load(false);
</script>
</body>
